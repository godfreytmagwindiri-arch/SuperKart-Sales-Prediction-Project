services:
  backend-api:
    build: ./backend_files
    container_name: backend-api
    ports:
      - "7860:7860"
    networks:
      - superkart-network

  frontend-ui:
    build: ./frontend_files
    container_name: frontend-ui
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend-api:7860
    depends_on:
      - backend-api
    networks:
      - superkart-network

networks:
  superkart-network:
    driver: bridge
